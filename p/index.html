<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rilup, verified capture</title>
<style>
  body{margin:0;background:#EAE2CF;color:#17110B;font-family:system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;min-height:100vh}
  .card{max-width:420px;width:100%;padding:16px;box-sizing:border-box}
  .media{width:100%;border-radius:14px;background:#000;display:block}
  .row{display:flex;align-items:center;gap:8px;margin:12px 0 4px}
  .user{font-weight:700}
  .seal{font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
  .seal .mark{height:15px;width:auto;display:block}
  .caption{margin:6px 0 16px;line-height:1.4}
  .brand{color:#FE5901;font-weight:800;font-size:22px;margin:20px 0 4px}
  .tag{color:#6E6355;font-size:13px;margin-bottom:16px}
  .cta{display:inline-block;background:#FE5901;color:#17110B;text-decoration:none;
       padding:12px 28px;border-radius:999px;font-weight:700}
  .note{color:#6E6355;font-size:12px;margin:24px 16px 32px;text-align:center;max-width:420px}
  .err{padding:40px 16px;text-align:center}
  /* Certificado de captura: las mismas seis filas y palabras que `ui/common/Certificado.kt`. */
  .cert{margin-top:8px;border:1px solid #D9CFB8;border-radius:14px;padding:14px 16px 12px;background:#F2ECDD}
  .cert .titulo{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#6E6355}
  .cert .encabezado{font-size:18px;font-weight:800;margin:4px 0 12px}
  .cert .encabezado.real{color:#FE5901}
  .cert .fila{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid #E4DCC8}
  .cert .punto{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:#B9AE98}
  .cert .punto.cumple{background:#2E8B57}
  .cert .punto.falla{background:#C0392B}
  .cert .etq{font-size:12px;color:#6E6355}
  .cert .val{font-size:14px;font-weight:600;line-height:1.3}
  .cert .nota{font-size:12px;color:#6E6355}
  .cert .huella{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;word-break:break-all;color:#4A4034}
  .cert .pie{font-size:11px;color:#6E6355;margin-top:10px;line-height:1.4}
</style>
</head>
<body>
<div class="card" id="card"><div class="err">…</div></div>
<div class="brand">rilup</div>
<div class="tag" id="tag">Back to real.</div>
<a class="cta" id="cta" href="https://rilup.com/#sumate">Get in</a>
<p class="note" id="note">Everything on Rilup was captured live with the in-app camera and verified cryptographically
at the moment of capture. No uploads. No generated content.<br>
Got this file outside Rilup? <a href="../verify/" style="color:#FE5901">Verify it by its fingerprint</a>.</p>
<script>
const API = "https://picjhxuzmyusghebkkhj.supabase.co/functions/v1/p/";
// Dos idiomas según el navegador: el enlace compartido llega a cualquiera (2026-10-27).
const esEs = (navigator.language || "en").toLowerCase().startsWith("es");
const EN_P = {
  verificado: "verified", real: "Real Confirmed", noexiste: "This post does not exist or was removed.", cargando: "Loading…",
  titulo: s => `@${s} on Rilup, verified capture`, alt: s => `Capture by @${s}`,
  cert_titulo: "Capture certificate", cert_enc: "This really happened", cert_real: "Real Confirmed",
  momento: "Moment of capture", firmado: "Signed by the secure chip at that instant", declarado: "Declared by the phone, without the chip's signature",
  llave: "Where the key lives", enclave: "Apple Secure Enclave", strongbox: "Dedicated security chip", tee: "Processor secure environment", sw: "Software only", sinllave: "No hardware key",
  equipo: "Device integrity", eq_apple: "Verified by Apple", eq_google: "Verified by Google", no_ok: "Not verified", sin_dato: "Could not be checked",
  app: "App integrity", app_apple: "Genuine Rilup, attested by Apple", app_google: "Genuine Rilup, from Google Play",
  lugar: "Place", evento: "Verified inside the event", huella: "File fingerprint (SHA-256)",
  pie: "This proof was generated at capture, not at publish, and cannot be added afterwards.",
};
const ES_P = {
  verificado: "verificado", real: "Real Confirmado", noexiste: "Esta publicación no existe o fue eliminada.", cargando: "Cargando…",
  titulo: s => `@${s} en Rilup, captura verificada`, alt: s => `Captura de @${s}`,
  cert_titulo: "Certificado de captura", cert_enc: "Esto ocurrió de verdad", cert_real: "Real Confirmado",
  momento: "Momento de la captura", firmado: "Firmado por el chip seguro en ese instante", declarado: "Declarado por el teléfono, sin firma del chip",
  llave: "Dónde vive la llave", enclave: "Secure Enclave de Apple", strongbox: "Chip de seguridad dedicado", tee: "Entorno seguro del procesador", sw: "Solo software", sinllave: "Sin llave de hardware",
  equipo: "Integridad del equipo", eq_apple: "Verificada por Apple", eq_google: "Verificada por Google", no_ok: "Sin verificar", sin_dato: "No se pudo comprobar",
  app: "Integridad de la app", app_apple: "Rilup original, atestada por Apple", app_google: "Rilup original, desde Google Play",
  lugar: "Lugar", evento: "Verificado dentro del evento", huella: "Huella del archivo (SHA-256)",
  pie: "Esta prueba se generó al capturar, no al publicar, y no se puede agregar después.",
};
const TP = esEs ? ES_P : EN_P;
if (esEs) {
  document.documentElement.lang = "es";
  document.title = "Rilup, captura verificada";
  document.getElementById("tag").textContent = "Vuelve a lo real.";
  document.getElementById("cta").textContent = "Quiero entrar";
  document.getElementById("note").innerHTML = 'Todo en Rilup fue capturado en vivo con la cámara, verificado criptográficamente en el momento de la captura. Sin importar archivos. Sin contenido generado.<br>¿Tienes este archivo fuera de Rilup? <a href="../verificar/" style="color:#FE5901">Verifícalo por su huella</a>.';
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Trazados de la marca Rilup, idénticos a res/drawable/ic_rilup_mark.xml, a web/mark.svg y a
// MARK_PATHS en supabase/functions/p/index.ts. Si cambia el logo, cambia en los cuatro.
const MARK_PATHS = [
  "M5760 10619 c-751 -34 -1537 -202 -2242 -478 -86 -34 -114 -50 -146 -85 -103 -112 -74 -278 60 -347 67 -34 116 -26 339 55 581 212 1089 328 1709 393 232 24 834 24 1040 0 471 -55 830 -155 1170 -328 188 -95 306 -170 460 -294 476 -382 772 -925 856 -1570 24 -180 24 -545 1 -715 -87 -633 -323 -1170 -718 -1635 -37 -44 -139 -151 -227 -237 -170 -168 -207 -221 -237 -333 -30 -116 -14 -237 48 -365 83 -172 661 -879 1126 -1380 383 -411 420 -439 540 -410 123 29 195 169 147 284 -8 19 -99 124 -202 233 -401 424 -787 876 -1106 1293 -111 146 -128 176 -128 227 0 35 9 46 112 148 161 158 239 244 347 380 523 655 791 1494 750 2346 -16 340 -88 676 -205 964 -299 731 -868 1283 -1639 1588 -401 159 -809 240 -1344 267 -221 11 -261 11 -511 -1z",
  "M5720 9773 c-19 -1 -87 -8 -150 -14 -620 -56 -1311 -254 -1884 -536 -249 -123 -308 -161 -340 -217 -87 -150 10 -325 180 -326 45 0 77 13 271 108 384 189 705 308 1083 402 338 84 602 123 947 142 621 33 1176 -82 1582 -328 192 -117 398 -305 513 -469 375 -538 409 -1267 89 -1920 -110 -225 -240 -404 -426 -590 -180 -181 -383 -328 -625 -453 -223 -116 -408 -183 -757 -276 -211 -56 -308 -118 -364 -231 -20 -43 -24 -64 -24 -145 1 -83 5 -105 33 -176 88 -222 513 -845 967 -1419 347 -440 846 -995 928 -1034 94 -45 171 -35 241 29 52 48 70 99 64 174 -6 71 -16 84 -220 303 -515 553 -1123 1339 -1467 1898 -96 157 -85 182 102 234 574 158 1026 406 1400 771 431 419 694 923 777 1493 25 163 27 497 5 659 -41 310 -177 667 -348 915 -402 584 -1057 923 -1937 1003 -104 9 -554 12 -640 3z",
  "M5615 8914 c-736 -85 -1486 -367 -2102 -791 -132 -90 -164 -124 -189 -197 -49 -144 79 -293 233 -270 34 5 76 27 167 89 493 333 1076 576 1646 684 242 45 355 55 635 55 292 0 392 -12 595 -69 393 -111 660 -355 767 -702 25 -82 27 -101 27 -268 0 -163 -3 -189 -27 -278 -67 -248 -229 -493 -441 -666 -254 -208 -554 -337 -1026 -441 -393 -87 -548 -154 -709 -304 -63 -60 -142 -175 -170 -250 -57 -153 -55 -90 -59 -1466 -2 -895 0 -1280 8 -1316 13 -60 56 -117 113 -145 32 -17 54 -20 103 -17 75 5 128 37 165 101 l24 42 5 1275 5 1275 22 58 c67 177 196 254 548 327 527 108 889 259 1205 500 353 270 590 653 661 1071 27 157 23 403 -9 539 -109 464 -413 817 -873 1013 -151 65 -317 111 -514 144 -127 21 -647 26 -810 7z",
  "M5710 8075 c-566 -71 -1153 -295 -1684 -642 -261 -170 -469 -342 -564 -465 -53 -69 -105 -175 -128 -263 -18 -67 -19 -141 -19 -2042 l0 -1971 30 -44 c42 -59 96 -88 165 -88 97 0 174 53 205 139 13 39 15 256 15 1916 0 1216 4 1891 10 1925 15 79 50 148 108 211 102 111 384 308 658 461 653 363 1414 525 1826 388 346 -115 278 -419 -137 -610 -151 -71 -283 -108 -685 -196 -91 -19 -205 -47 -255 -61 -647 -180 -1029 -588 -1095 -1169 -8 -70 -10 -509 -8 -1486 l3 -1386 30 -44 c42 -59 96 -88 166 -88 80 0 135 31 177 100 l32 54 0 1286 c1 707 5 1344 9 1415 10 141 29 232 72 338 106 263 330 444 680 550 62 19 227 58 364 87 273 57 447 106 607 170 444 178 690 466 691 810 1 343 -249 600 -670 690 -130 28 -437 36 -603 15z",
  "M7134 4771 c-96 -24 -159 -107 -159 -206 1 -71 9 -88 112 -233 403 -567 942 -1205 1483 -1755 113 -115 223 -219 245 -232 84 -49 177 -41 245 21 51 46 75 108 67 174 -8 68 -30 105 -102 175 -177 172 -568 593 -812 875 -248 288 -510 619 -728 922 -65 89 -130 176 -144 191 -51 56 -140 85 -207 68z",
];
const mark = color =>
  `<svg class="mark" viewBox="0 0 641 838" fill="${color}" aria-hidden="true">` +
  `<g transform="translate(-330.99561,1062.800234) scale(0.1,-0.1)">` +
  MARK_PATHS.map(d => `<path d="${d}"/>`).join("") +
  `</g></svg>`;

// El certificado tal como lo muestra la app (`Certificado.kt`): momento, llave, equipo, app,
// lugar y huella. En iOS las palabras son de Apple; en Android, de Google. Si el servidor no
// lo manda (publicacion no publica o error) no se muestra nada.
function fila(etq, val, estado, nota) {
  const clase = estado === true ? "cumple" : estado === false ? "falla" : "";
  return `<div class="fila"><span class="punto ${clase}"></span><div>` +
    `<div class="etq">${etq}</div><div class="val">${esc(val)}</div>` +
    (nota ? `<div class="nota">${esc(nota)}</div>` : "") + `</div></div>`;
}
function certificado(c) {
  if (!c || !c.momento) return "";
  const ios = c.plataforma === "ios";
  const fecha = new Date(c.momento);
  const off = typeof c.momento_offset_min === "number" ? c.momento_offset_min : null;
  // Hora local del lugar de la captura, no del lector: se corre el instante y se imprime en UTC.
  let momento;
  if (off !== null) {
    const d = new Date(fecha.getTime() + off * 60000);
    const dd = n => String(n).padStart(2, "0");
    const sg = off >= 0 ? "+" : "-", a = Math.abs(off);
    momento = (esEs ? `${dd(d.getUTCDate())}/${dd(d.getUTCMonth() + 1)}/${d.getUTCFullYear()} ` : `${d.getUTCFullYear()}-${dd(d.getUTCMonth() + 1)}-${dd(d.getUTCDate())} `) +
      `${dd(d.getUTCHours())}:${dd(d.getUTCMinutes())} (UTC${sg}${dd(Math.floor(a / 60))}:${dd(a % 60)})`;
  } else {
    momento = fecha.toLocaleString(esEs ? "es-CL" : "en-US", { dateStyle: "medium", timeStyle: "short" });
  }
  const llave = ({ strongbox: ios ? TP.enclave : TP.strongbox, tee: TP.tee, software: TP.sw })[c.nivel_llave] || TP.sinllave;
  const llaveOk = c.nivel_llave === "strongbox" || c.nivel_llave === "tee" ? true
    : c.nivel_llave === "software" ? false : null;
  const equipo = c.equipo === "ok" ? (ios ? TP.eq_apple : TP.eq_google) : c.equipo === "no" ? TP.no_ok : TP.sin_dato;
  const app = c.app === "ok" ? (ios ? TP.app_apple : TP.app_google) : c.app === "no" ? TP.no_ok : TP.sin_dato;
  const estado = v => v === "ok" ? true : v === "no" ? false : null;
  const huella = c.huella ? (c.huella.match(/.{1,8}/g) || []).join(" ") : "";
  return `<div class="cert">` +
    `<div class="titulo">${TP.cert_titulo}</div>` +
    `<div class="encabezado ${c.confirmado_real ? "real" : ""}">${c.confirmado_real ? TP.cert_real : TP.cert_enc}</div>` +
    fila(TP.momento, momento, c.momento_firmado ? true : null, c.momento_firmado ? TP.firmado : TP.declarado) +
    fila(TP.llave, llave, llaveOk) +
    fila(TP.equipo, equipo, estado(c.equipo)) +
    fila(TP.app, app, estado(c.app)) +
    (c.lugar ? fila(TP.lugar, c.lugar, true, c.en_evento ? TP.evento : null) : "") +
    (huella ? `<div class="fila"><span class="punto cumple"></span><div><div class="etq">${TP.huella}</div><div class="huella">${esc(huella)}</div></div></div>` : "") +
    `<div class="pie">${TP.pie}</div>` +
    `</div>`;
}

(async () => {
  const card = document.getElementById("card");
  const id = new URLSearchParams(location.search).get("id") || "";
  if (!/^[0-9a-f-]{36}$/i.test(id)) {
    card.innerHTML = `<div class="err">${TP.noexiste}</div>`;
    return;
  }
  try {
    const r = await fetch(API + id + "?format=json");
    if (!r.ok) throw 0;
    const p = await r.json();

    // Trim declarado → el navegador reproduce solo la ventana (#t=inicio,fin)
    let frag = "";
    const trim = (p.transformations || []).find(t => t && t.type === "trim");
    if (trim) frag = `#t=${trim.start_ms/1000},${trim.end_ms/1000}`;

    const media = p.media_type === "video"
      ? `<video class="media" controls playsinline ${p.thumb_url ? `poster="${esc(p.thumb_url)}"` : ""} src="${esc(p.media_url)}${frag}"></video>`
      : `<img class="media" src="${esc(p.media_url)}" alt="${esc(TP.alt(p.username))}">`;

    // El sello es la MARCA de Rilup, nunca un check (PRODUCT.md, 2026-08-05): en otras redes el
    // ✔ significa identidad, y acá significa origen del contenido. Mismo criterio que
    // `ui/common/RealSeal.kt` y `functions/p`. Los trazados van inline y no por <use> a
    // mark.svg: las referencias externas de SVG no son confiables entre navegadores.
    const seal = p.confirmed_real
      ? mark("#FE5901") + `<span>${TP.real}</span>`
      : mark("#6E6355") + `<span>${TP.verificado}</span>`;

    card.innerHTML = media +
      `<div class="row"><span class="user">@${esc(p.username)}</span><span class="seal">${seal}</span></div>` +
      (p.caption ? `<div class="caption">${esc(p.caption)}</div>` : "") +
      certificado(p.certificado);
    document.title = TP.titulo(p.username);
  } catch {
    card.innerHTML = `<div class="err">${TP.noexiste}</div>`;
  }
})();
</script>
</body>
</html>
